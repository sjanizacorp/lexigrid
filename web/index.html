const root=document.getElementById('root');let token=sessionStorage.getItem('lexigrid_token')||'',tenant=sessionStorage.getItem('lexigrid_tenant')||'',role='',page='Dashboard',cache={};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,method='GET',data,credential=token,operationId){
 let r=await fetch(path,{method,headers:{'Authorization':'Bearer '+credential,...(data?{'Content-Type':'application/json'}:{}),...(operationId?{'X-LexiGrid-Operation-ID':operationId}:{})},body:data?JSON.stringify(data):undefined});
 let v=await r.json().catch(()=>({}));
 if(!r.ok){const reference=r.headers.get('X-Request-ID')||v.request_id;const error=Error((v.detail?JSON.stringify(v.detail):`HTTP ${r.status}`)+(reference?` (request ${reference})`:''));error.status=r.status;error.requestId=reference;throw error}return v
}
function reportImportInterfaceError(event){
 if(!['Document Extraction','Bulk Import'].includes(page)||!token)return;
 const activity=page==='Document Extraction'?'reviewed_import':'bulk_import';
 const kind=document.getElementById(page==='Document Extraction'?'docKind':'bulkKind')?.value||'requirements';
 const operationId=crypto.randomUUID(),status=document.getElementById(page==='Document Extraction'?'docStatus':'bulkResult');
 if(status){status.textContent='An interface error prevented completion. Check the target records before retrying. Reference: '+operationId;status.className='error'}
 api('/api/client-events','POST',{activity,event:'client_error',kind,selected_count:0,line:Number.isInteger(event.lineno)?Math.min(Math.max(event.lineno,0),100000):0},token,operationId).catch(()=>console.warn('Client diagnostic could not be recorded'));
}
window.addEventListener('error',reportImportInterfaceError);
window.addEventListener('unhandledrejection',reportImportInterfaceError);

function ssoStartUrl(protocol,tenantId){
 if(!['oidc','saml'].includes(protocol))throw Error('Unsupported sign-in provider');
 return '/api/auth/'+protocol+'/start?'+new URLSearchParams({tenant_id:tenantId,ui:'true'});
}
function startSso(protocol,tenantId){location.assign(ssoStartUrl(protocol,tenantId))}
async function loadSsoProviders(container){
 try{
  const providers=await api('/api/auth/providers');
  if(!container.isConnected)return;
  const choice=document.getElementById('tenant-choice');
  for(const provider of providers){
   if(!['oidc','saml'].includes(provider.protocol))continue;
   const button=document.createElement('button');button.type='button';button.style.margin='6px';
   button.textContent='Sign in with '+provider.label;button.dataset.sso=provider.protocol;
   button.onclick=()=>{if(!choice.value){choice.reportValidity();return}startSso(provider.protocol,choice.value)};
   container.append(button);
  }
 }catch(error){if(container.isConnected)container.textContent='Organization SSO options unavailable. Refresh to retry.'}
}
async function loginScreen(msg=''){root.innerHTML=`<div class="login card"><h1>Lexi<span style="color:#69a6ff">Grid</span></h1><p>Integrated Risk Management · Secure sign in</p><form id="login"><label>Organization / Tenant<select name="tenant_id" id="tenant-choice" required><option value="">Loading tenants…</option></select></label><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><label>Authenticator code (if enabled)<input name="totp_code" inputmode="numeric" maxlength="32" placeholder="6-digit code (optional)"></label><button>Sign in</button><p class="error">${esc(msg)}</p></form><div id="sso-login"></div><div class="footer">Developed by Shahryar Jahangir · Aniza Inc.</div></div>`;loadSsoProviders(document.getElementById('sso-login'));try{let rows=await api('/api/auth/tenants');let el=document.getElementById('tenant-choice');el.innerHTML='<option value="">Select organization</option>'+rows.map(t=>`<option value="${esc(t.id)}" ${t.id===tenant?'selected':''}>${esc(t.name)}</option>`).join('')}catch(err){document.getElementById('tenant-choice').innerHTML='<option value="">Unable to load tenants</option>';root.querySelector('.error').textContent=err.message}document.getElementById('login').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');if(button.disabled)return;button.disabled=true;let x=Object.fromEntries(new FormData(e.target));if(!x.totp_code)delete x.totp_code;try{let v=await api('/api/auth/login','POST',x);tenant=v.tenant_id;sessionStorage.setItem('lexigrid_tenant',tenant);if(v.mfa_enrollment_required){const login=e.target;await openMfaEnrollment(v.enrollment_token,()=>login.isConnected&&!token);return}token=v.access_token;sessionStorage.setItem('lexigrid_token',token);await shell()}catch(err){loginScreen(err.message)}finally{button.disabled=false}}}

const pages=['Dashboard','Risks','Risk Acceptance','Controls','Frameworks','Requirements','Policies','Approvals','Remediations','Vendors','Business Services','Loss Events','Audit','Compliance Audits','Security','Administration','Email Configuration','Reports','Risk Assessment','Exports','Enterprise IRM','Workflows','Bulk Import','Document Extraction'];async function shell(){try{let me=await api('/api/me');role=me.role;window.lexigridUserId=me.id;window.lexigridUserEmail=me.email.toLowerCase();root.innerHTML=`<div class="layout"><aside class="sidebar"><div class="brand">Lexi<span>Grid</span></div><div class="muted" style="padding:0 12px 14px">ENTERPRISE IRM</div>${pages.map(p=>`<button class="nav" data-page="${p}">${p}</button>`).join('')}<div class="footer">Shahryar Jahangir<br>Aniza Inc.<br><br>${esc(me.email)}<br>${esc(role)}</div></aside><main class="main"><div class="top"><div><div class="muted">WORKSPACE / <span id="breadcrumb"></span></div><h1 id="heading"></h1></div><button id="logout">Sign out</button></div><div id="content"></div></main></div>`;document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>navigate(b.dataset.page));document.getElementById('logout').onclick=async()=>{try{await api('/api/auth/logout','POST',{})}catch(e){console.warn('Logout audit request failed',e)}sessionStorage.removeItem('lexigrid_token');token='';loginScreen()};await navigate(page)}catch(e){loginScreen(e.message)}}
async function navigate(p){page=p;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===p));document.getElementById('heading').textContent=p;document.getElementById('breadcrumb').textContent=p;closeModal();const previous=document.getElementById('content');const c=previous.cloneNode(false);previous.replaceWith(c);c.innerHTML='<p>Loading…</p>';try{if(p==='Dashboard')await dashboard(c);else if(p==='Risks')await risks(c);else if(p==='Risk Acceptance')await riskAcceptanceQueue(c);else if(p==='Controls')await generic(c,'/api/controls',['code','title','owner','status'],'New control',controlForm);else if(p==='Frameworks')await frameworksPage(c);else if(p==='Requirements')await requirementsPage(c);else if(p==='Policies')await generic(c,'/api/policies',['code','title','owner','status'],'New policy',policyForm);else if(p==='Approvals')await approvals(c);else if(p==='Remediations')await remediations(c);else if(p==='Vendors')await generic(c,'/api/vendors',['name','service','criticality','owner','status'],'New vendor',vendorForm);else if(p==='Business Services')await generic(c,'/api/business-services',['name','owner','criticality','recovery_time_hours','recovery_point_hours'],'New service',serviceForm);else if(p==='Loss Events')await generic(c,'/api/loss-events',['title','occurred_on','loss_cents','service_id'],'New loss event',lossForm);else if(p==='Audit')await generic(c,'/api/audit',['at','action','actor_id','object_id'],null,null);else if(p==='Compliance Audits')await compliancePage(c);else if(p==='Security')await securityPage(c);else if(p==='Administration')await administration(c);else if(p==='Email Configuration')await mailConfigurationPage(c);else if(p==='Reports')await reportsPage(c);else if(p==='Risk Assessment')await riskMethodPage(c);else if(p==='Exports')await exportsPage(c);else if(p==='Enterprise IRM')await enterprisePage(c);else if(p==='Workflows')await workflowPage(c);else if(p==='Bulk Import')await bulkImportPage(c);else if(p==='Document Extraction')await documentExtractionPage(c)}catch(e){c.innerHTML=`<div class="card error">${esc(e.message)}</div>`}}
function table(items,fields,action){if(!items.length)return '<p>No records found.</p>';return `<div class="tablewrap"><table><thead><tr>${fields.map(f=>`<th>${esc(f.replaceAll('_',' '))}</th>`).join('')}${action?'<th>Action</th>':''}</tr></thead><tbody>${items.map((x,i)=>`<tr>${fields.map(f=>`<td>${esc(typeof x[f]==='object'?JSON.stringify(x[f]):x[f])}</td>`).join('')}${action?`<td><button class="row-action" data-i="${i}">${esc(action.label)}</button></td>`:''}</tr>`).join('')}</tbody></table></div>`}
function wireActions(c,items,action){if(action)c.querySelectorAll('.row-action').forEach(b=>b.onclick=()=>action.run(items[+b.dataset.i]))}
function openModal(title,html){document.getElementById('modal-title').textContent=title;document.getElementById('modal-body').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function modalContentIsCurrent(element){return element.isConnected&&element.closest('.modal').classList.contains('show')}
function wireSaveForm(save){
 const form=document.getElementById('edit-form');
 const button=form.querySelector('button');
 const error=form.querySelector('#form-error');
 form.onsubmit=async event=>{
  event.preventDefault();
  if(button.disabled)return;
  const data=Object.fromEntries(new FormData(form));
  button.disabled=true;
  error.textContent='';
  try{
   await save(data);
   if(modalContentIsCurrent(form)){closeModal();await navigate(page)}
  }catch(err){
   error.textContent=err.message;
  }finally{
   button.disabled=false;
  }
 };
}
function form(title,fields,save){openModal(title,`<form id="edit-form">${fields.map(([key,label,type='text',options=''])=>`<label>${esc(label)}${type==='textarea'?`<textarea name="${key}" required></textarea>`:type==='select'?`<select name="${key}">${options.split('|').map(x=>`<option>${esc(x)}</option>`).join('')}</select>`:`<input name="${key}" type="${type}" required>`}</label>`).join('')}<button>Save</button><p id="form-error" class="error"></p></form>`);wireSaveForm(save)}

async function generic(c,path,fields,label,make){let items=await api(path);if(!Array.isArray(items))items=items.items||[];let spec=EDIT_SPECS[path],canEdit=spec&&(role==='platform_admin'||spec.roles.includes(role));c.innerHTML=`<div class="card">${label?`<button id="new">+ ${esc(label)}</button>`:''}${table(items,fields,canEdit?{label:'Edit'}:null)}</div>`;if(label)c.querySelector('#new').onclick=make;if(path==='/api/controls'){const info=document.createElement('p');info.textContent=items.length+' controls in this workspace. Imports saved as Requirements appear under Frameworks.';c.querySelector('.card').prepend(info);const button=document.createElement('button');button.textContent='Import controls from a document';button.onclick=()=>{cache.documentImportKind='controls';navigate('Document Extraction')};c.querySelector('.card').prepend(button)}if(canEdit)wireActions(c,items,{run:r=>{if(spec.allowed&&!spec.allowed(r)){alert('Only draft policies can be edited.');return}editForm('Edit '+(r.title||r.name||r.code),spec.fields,r,d=>api(spec.endpoint(r),spec.method,{...d,...(spec.version?{version:r.version}:{})}))}})}

async function compliancePage(c){
 const editable=['platform_admin','tenant_admin','risk_manager','auditor'].includes(role),admin=['platform_admin','tenant_admin'].includes(role),canFinalize=['platform_admin','tenant_admin','auditor'].includes(role);
 let frames=await api('/api/frameworks'),connections=[];if(!c.isConnected)return;
 if(editable)try{connections=await api('/api/compliance/connectors')}catch(e){connections=[]}
 async function download(path,name){const response=await fetch(path,{headers:{Authorization:'Bearer '+token}});if(!response.ok)throw Error('Download failed: '+response.status+' '+await response.text());const url=URL.createObjectURL(await response.blob()),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
 const selectOptions=rows=>rows.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name||x.title||x.id)+'</option>').join('');
 async function home(){
  c.innerHTML='<section class="card"><h2>Compliance audits</h2><p>Create an evidence-based audit of every imported safeguard in selected frameworks. Applicability, implementation and effectiveness are separate decisions. Untested safeguards do not pass. Imported catalogue completeness must be checked against the full source standard.</p><p>Entra and Active Directory checks test stated configuration or sampled operating facts. They do not independently establish every standard obligation. Physical, organizational and other unsupported safeguards require documented tests and independent review.</p><button id="audit-collector">Download read-only AD collector</button><p id="audit-home-error" class="error" role="alert"></p><div id="audit-create-area"></div><div id="audit-connector-area"></div><h3>Saved audits</h3><div id="audit-list"></div></section>';
  const error=c.querySelector('#audit-home-error');c.querySelector('#audit-collector').onclick=()=>download('/api/compliance/collectors/active-directory.ps1','Collect-LexiGridAD.ps1').catch(e=>error.textContent=e.message);
  if(editable){c.querySelector('#audit-create-area').innerHTML='<details><summary>Create audit</summary><form id="audit-create"><label>Audit title<input name="title" minlength="3" maxlength="200" required></label><label>Scope, systems and observation period<textarea name="scope" minlength="10" maxlength="5000" required></textarea></label><label>Frameworks / standards — select every in-scope edition<select name="framework_ids" multiple required>'+frames.map(f=>'<option value="'+esc(f.id)+'">'+esc(f.name+' — '+f.revision)+'</option>').join('')+'</select></label><label><input name="include_controls" type="checkbox" checked>Include unmapped workspace controls as separate, unattributed safeguards</label><button>Create full catalogue snapshot</button><p class="form-error error"></p></form></details>';
   const form=c.querySelector('#audit-create');wire(form,async()=>{const ids=[...form.elements.framework_ids.selectedOptions].map(x=>x.value);if(!ids.length)throw Error('Choose an imported framework. Import the full requirements catalogue first.');const result=await api('/api/compliance/audits','POST',{title:form.elements.title.value,scope:form.elements.scope.value,framework_ids:ids,include_unmapped_controls:form.elements.include_controls.checked});await show(result.id)})}
  if(admin){c.querySelector('#audit-connector-area').innerHTML='<details><summary>Configure read-only Microsoft Entra connector</summary><p>Use a dedicated app registration with Policy.Read.All and AuditLog.Read.All application permissions and administrator consent. Commercial Microsoft Graph is supported. Configure only a directory you are authorized to audit. LexiGrid uses read-only Graph GET resources; the app credential is encrypted with the existing evidence encryption provider.</p><form id="audit-entra-config"><label>Name<input name="name" minlength="3" required></label><label>Microsoft directory tenant ID<input name="directory_tenant_id" required></label><label>Application client ID<input name="client_id" required></label><label>Client secret<input name="client_secret" type="password" autocomplete="new-password" required></label><label>Sign-in observation days (1–30)<input name="lookback_days" type="number" min="1" max="30" value="7" required></label><button>Save encrypted connector</button><p class="form-error error"></p></form><div id="audit-connections"></div></details>';
   const form=c.querySelector('#audit-entra-config');wire(form,async()=>{const body=Object.fromEntries(new FormData(form));body.lookback_days=Number(body.lookback_days);await api('/api/compliance/connectors/entra','POST',body);form.elements.client_secret.value='';connections=await api('/api/compliance/connectors');await home()});
   const box=c.querySelector('#audit-connections');box.innerHTML=connections.map(x=>'<p>'+esc(x.name+' — '+x.state)+' '+(x.state==='active'?'<button data-disable-connector="'+esc(x.id)+'">Disable collection</button>':'')+'</p>').join('');for(const button of box.querySelectorAll('button'))button.onclick=async()=>{button.disabled=true;try{await api('/api/compliance/connectors/'+encodeURIComponent(button.dataset.disableConnector)+'/disable','POST',{});connections=await api('/api/compliance/connectors');await home()}catch(e){error.textContent=e.message;button.disabled=false}}
  }
  const audits=await api('/api/compliance/audits?limit=500');if(!c.isConnected)return;c.querySelector('#audit-list').innerHTML=audits.items.map(x=>'<p><button data-open-audit="'+esc(x.id)+'">'+esc(x.title+' — '+x.state+' — '+x.total_safeguards+' safeguards')+'</button></p>').join('')||'<p>No audits yet. Import the complete requirements and controls before creating an audit.</p>';for(const button of c.querySelectorAll('[data-open-audit]'))button.onclick=()=>show(button.dataset.openAudit).catch(e=>error.textContent=e.message);
 }
 function wire(form,save){let busy=false;form.onsubmit=async event=>{event.preventDefault();if(busy)return;busy=true;const button=form.querySelector('button'),error=form.querySelector('.form-error');button.disabled=true;error.textContent='';try{await save()}catch(e){if(form.isConnected)error.textContent=e.message}finally{busy=false;if(form.isConnected)button.disabled=false}}}
 async function show(id){
  const value=await api('/api/compliance/audits/'+encodeURIComponent(id));if(!c.isConnected)return;const open=value.state==='open',base='/api/compliance/audits/'+encodeURIComponent(id);

  if(!preview||file.files[0]!==preview.source||kind.value!==preview.kind){message('The source changed. Extract and review the candidates again.',true);event('source_changed');return}
  if(kind.value==='requirements'&&!selector.value){frameworkForm.hidden=false;message('A target framework is required. Enter its name and revision above, then choose Create framework and use as target. Your selected requirements are preserved.',true);event('framework_required');frameworkName.focus();return}
  operationId=crypto.randomUUID();const payload=reviewedPayload();if(!payload)return;
  pending={payload,source:preview.source,kind:preview.kind};confirmation.hidden=false;
  const target=preview.kind==='requirements'?' into '+selector.options[selector.selectedIndex].textContent:' into '+destinationText(preview.kind);
  c.querySelector('#docConfirmText').textContent='Import '+selectedCount()+' reviewed '+preview.kind+target+'?'+(preview.kind==='controls'?' Existing codes and repeated rows will be skipped; new controls will be imported.':'');
  message('Destination: '+destinationText()+'. Review the selection and target below, then choose Confirm import.');event('confirmation_opened');updateControls();confirmButton.focus();
 };
 cancelButton.onclick=()=>{cancelPending();event('cancelled');updateControls();message('Import cancelled. No records were created.')};
 confirmButton.onclick=async()=>{
  if(busy||!pending)return;
  const review=pending;
  if(!preview||review.source!==file.files[0]||review.kind!==kind.value||JSON.stringify(reviewedPayload())!==JSON.stringify(review.payload)){
   cancelPending();updateControls();message('The selection or source changed. Review and confirm again.',true);event('source_changed');return;
  }
  busy=true;updateControls();message('Importing '+selectedCount()+' reviewed '+review.kind+'…');
  try{
   const result=await api(review.kind==='requirements'?'/api/documents/import-reviewed-requirements':'/api/documents/import-reviewed','POST',review.payload,token,operationId);
   const target=review.payload.framework_id,destination=result.destination||{kind:review.kind,page:review.kind==='requirements'?'Frameworks':{controls:'Controls',frameworks:'Frameworks',policies:'Policies'}[review.kind],framework_id:target},location=destinationText(review.kind);clearPreview();
   message('Imported '+result.created+' reviewed '+review.kind+(review.kind==='controls'?'; skipped '+(result.skipped_count||0)+' existing/repeated controls':'')+'. View them in '+location+'. Source hash: '+result.source_sha256+'. Import reference: '+operationId);
   if(result.skipped?.length){const details=document.createElement('details'),heading=document.createElement('summary'),list=document.createElement('ul');heading.textContent='Skipped controls ('+result.skipped_count+')';for(const skip of result.skipped){const item=document.createElement('li');item.textContent='Item '+skip.item+': '+skip.code+' — '+(skip.reason==='duplicate_in_batch'?'Repeated in this import; first occurrence kept.':'Already exists; existing control unchanged.');list.append(item)}details.append(heading,list);summary.append(details)}
   openFramework.textContent=review.kind==='requirements'?'Open imported requirements':'Open '+destination.page;openFramework.hidden=false;openFramework.onclick=()=>{if(destination.framework_id)cache.requirementFramework=destination.framework_id;navigate(review.kind==='requirements'?'Requirements':destination.page)};
  }catch(error){
   cancelPending();
   if(error.status)message('Import failed: '+error.message,true);
   else{message('Import result could not be verified. Check the target records before retrying. Reference: '+operationId,true);event(error instanceof TypeError?'network_error':'client_error')}
  }finally{busy=false;updateControls()}
 };
}
